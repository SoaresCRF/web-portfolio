<section aria-labelledby="repository-count" class="container mb-12 px-4 pt-6 pb-12 md:px-12">
    <!-- Cabeçalho com contador -->
    <h2 id="repository-count" class="mb-12 border-b border-line pb-2 text-center text-h3 font-bold text-ink">
        📂 Carregando projetos…
    </h2>

    <!-- Controles -->
    <div id="controls" role="region" aria-label="Controles de filtro e ordenação" class="mb-6 grid grid-cols-1 items-end gap-4 md:grid-cols-3">
        <div>
            <label for="search" class="sr-only">Buscar por nome do projeto</label>
            <input type="text" id="search"
                class="block placeholder:text-ink/75 w-full rounded-md border border-line bg-white px-3 py-1.5 text-base text-ink transition-[border-color,box-shadow] duration-150 ease-in-out focus:border-[#343a40] focus:shadow-[0_0_0_0.2rem_rgb(52_58_64/0.25)] focus:outline-none" placeholder="🔍 Buscar por nome..."
                aria-label="Buscar por nome do projeto" />
        </div>

        <div>
            <label id="language-label" for="dropdown-button" class="sr-only">Filtrar por linguagem</label>
            <div id="language-filter" class="relative w-full">
                <button id="dropdown-button" type="button" aria-haspopup="listbox" aria-expanded="false"
                    aria-labelledby="language-label dropdown-button"
                    class="bg-chevron flex cursor-pointer items-center gap-2 text-left w-full rounded-md border border-line bg-white px-3 py-1.5 text-base text-ink transition-[border-color,box-shadow] duration-150 ease-in-out focus:border-[#343a40] focus:shadow-[0_0_0_0.2rem_rgb(52_58_64/0.25)] focus:outline-none">
                    🌐 Todas as linguagens
                </button>
                <ul id="dropdown-list" role="listbox" tabindex="-1" hidden aria-labelledby="language-label"
                    class="absolute z-1000 mt-0.5 flex max-h-50 w-full flex-col overflow-y-auto rounded border border-[#ccc] bg-white">
                </ul>
            </div>
        </div>

        <div>
            <button id="sort-button" type="button" class="btn btn-hover-effect [--btn-color:var(--color-muted)]">
                🗂️ Exibindo: Recentes
            </button>
        </div>
    </div>

    <!-- Mensagens de carregamento, erro e lista vazia -->
    <p id="repository-status" role="status" class="text-center text-muted not-empty:mb-6"></p>

    <!-- Lista de repositórios -->
    <ul id="repository-list" class="flex flex-col" aria-label="Lista de projetos">
        <!-- Itens dinâmicos via JS -->
    </ul>

    <!-- Paginação -->
    <nav aria-label="Paginação de projetos" class="mt-6">
        <ul id="pagination" class="mt-6 mb-4 flex flex-wrap justify-center gap-2">
        </ul>
    </nav>

    <!-- Template para item de repositório -->
    <template id="repository-template">
        <li class="mb-4 rounded-lg bg-surface px-6 py-4 text-item shadow-list">
            <a class="repository-link mb-1 block text-lead font-semibold" href="#" target="_blank"
                rel="noopener noreferrer">
                Nome do projeto
            </a>

            <p class="repository-description mb-2 text-small italic">Descrição do projeto</p>

            <!-- Container flexível com espaçamento entre os elementos -->
            <div
                class="repository-meta flex flex-col items-start justify-between gap-2 text-small sm:flex-row sm:items-center">

                <!-- Texto à esquerda -->
                <div class="flex flex-wrap gap-2">
                    <span
                        class="repository-language inline-flex items-center justify-center rounded-md px-2 py-1 text-[0.75em] leading-none font-bold whitespace-nowrap">
                        Linguagem
                    </span>
                    <span class="repository-pushed">| Atualizado em: Data</span>
                </div>

                <!-- Ícone de download à direita -->
                <a href="#" class="ms-4 text-lead" download title="Baixar código fonte do projeto"
                    data-download>
                    <svg class="inline-block size-[1em] align-[-0.125em]" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2"
                        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                        <path d="M1.5 10v3A1.5 1.5 0 0 0 3 14.5h10a1.5 1.5 0 0 0 1.5-1.5v-3" />
                        <path d="M8 1.5v9M4.5 7 8 10.5 11.5 7" />
                    </svg>
                </a>
            </div>
        </li>
    </template>
</section>
