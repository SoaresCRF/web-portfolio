<!DOCTYPE html>

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description"
        content="Site pessoal com informações sobre mim, formações acadêmicas, projetos e contatos." />

    <link rel="canonical" href="https://soarescrf.github.io/web-portfolio/" />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:url" content="https://soarescrf.github.io/web-portfolio/" />
    <meta property="og:title" content="Matheus Soares — Portfólio" />
    <meta property="og:description"
        content="Site pessoal com informações sobre mim, formações acadêmicas, projetos e contatos." />
    <meta property="og:image" content="https://soarescrf.github.io/web-portfolio/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Matheus Soares — Desenvolvedor · Portfólio" />

    <link rel="apple-touch-icon" sizes="180x180" href="assets/img/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="assets/img/favicon-16x16.png" />

</head>

<body class="flex min-h-screen flex-col bg-linear-to-r from-[#eef2f3] to-[#8e9eab] text-ink">

    <!-- Cabeçalho -->
    <header class="py-12">
        <div class="container">
            <h1 class="sr-only">Portfólio de Matheus Soares</h1>

            <nav class="mb-6" aria-label="Navegação principal">
                <div class="flex flex-col flex-wrap justify-center gap-2 md:flex-row md:gap-6">
                    <button type="button" class="btn btn-hover-effect rounded-lg px-4 py-2 text-xl/normal font-bold"
                        data-section="about" aria-controls="content" aria-label="Ir para a seção Sobre Mim">
                        Sobre Mim
                    </button>
                    <button type="button" class="btn btn-hover-effect rounded-lg px-4 py-2 text-xl/normal font-bold"
                        data-section="education" aria-controls="content" aria-label="Ir para a seção Formação">
                        Formação
                    </button>
                    <button type="button" class="btn btn-hover-effect rounded-lg px-4 py-2 text-xl/normal font-bold"
                        data-section="projects" aria-controls="content" aria-label="Ir para a seção Projetos">
                        Projetos
                    </button>
                </div>
            </nav>

            <div class="text-center text-lead" role="region" aria-label="Links para download e GitHub do projeto">
                <p class="mb-2 text-center">Baixe a versão mobile para Android ou confira o projeto no GitHub:</p>
                <div class="inline-flex flex-wrap justify-center gap-2">
                    <a href="https://github.com/SoaresCRF/kotlin-mobile-portfolio/releases/download/v1.3.0/soares-v1.3.0.apk"
                        class="font-semibold text-link" rel="noopener noreferrer">
                        📥 Download
                    </a>
                    <span aria-hidden="true">|</span>
                    <a href="https://github.com/SoaresCRF/kotlin-mobile-portfolio"
                        class="font-semibold text-link" target="_blank" rel="noopener noreferrer">
                        💻 GitHub
                    </a>
                </div>
            </div>
        </div>
    </header>

    <!-- Conteúdo principal -->
    <main id="main" tabindex="-1" class="my-6 grow">
        <div class="container rounded-2xl bg-white p-6 shadow-panel md:p-12">
            <section id="content" class="animate-fade-in">
                <!-- Altura de tela enquanto carrega: o rodapé não aparece para depois ser empurrado (CLS) -->
                <p class="min-h-screen">Carregando conteúdo...</p>
            </section>
        </div>
    </main>

    <!-- Rodapé -->
    <footer class="mt-auto py-12">
        <div class="container text-center">
            <h2 id="contato-heading" class="mb-6 text-h3 font-bold">
                👾 Curtiu? Aguardo seu "ping"! 😉
            </h2>

            <div id="social-network-contacts" class="mt-8 mb-6 flex flex-wrap justify-center gap-6 text-center"
                role="group" aria-label="Redes sociais">
                <a href="https://github.com/SoaresCRF" target="_blank" title="GitHub" aria-label="GitHub"
                    class="group">
                    <img src="assets/img/github.png" class="mx-2.5 w-8 grayscale transition-[transform,filter] duration-300 ease-[ease] group-hover:scale-110 group-hover:grayscale-0" alt="GitHub" width="32"
                        height="32" loading="lazy" />
                </a>

                <a href="https://www.linkedin.com/in/matheus-soares-0569b8251/" target="_blank" title="LinkedIn"
                    aria-label="LinkedIn" class="group">
                    <img src="assets/img/linkedin.png" class="mx-2.5 w-8 grayscale transition-[transform,filter] duration-300 ease-[ease] group-hover:scale-110 group-hover:grayscale-0" alt="LinkedIn" width="32"
                        height="32" loading="lazy" />
                </a>

                <a href="https://www.instagram.com/soarescrf_/" target="_blank" title="Instagram" aria-label="Instagram"
                    class="group">
                    <img src="assets/img/instagram.png" class="mx-2.5 w-8 grayscale transition-[transform,filter] duration-300 ease-[ease] group-hover:scale-110 group-hover:grayscale-0" alt="Instagram" width="32"
                        height="32" loading="lazy" />
                </a>

                <a href="mailto:matheussoarescrf10@gmail.com" title="E-mail" aria-label="E-mail"
                    class="group">
                    <img src="assets/img/email.png" class="mx-2.5 w-8 grayscale transition-[transform,filter] duration-300 ease-[ease] group-hover:scale-110 group-hover:grayscale-0" alt="E-mail" width="32"
                        height="32" loading="lazy" />
                </a>
            </div>

            <div>
                <p class="mb-1 text-center italic">Um jovem desenvolvedor. 🚀</p>
                <p class="text-center">&copy; 2025 Matheus Soares.</p>
            </div>
        </div>
    </footer>

    <script type="module" src="assets/js/dynamic-content.js"></script>
</body>

</html>
