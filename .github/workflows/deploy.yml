name: Deploy to GitHub Pages

# Builds the site with Vite and publishes dist/ to GitHub Pages.
# Requires Settings > Pages > Source set to "GitHub Actions".
on:
  push:
    branches: [main]
  # Daily rebuild refreshes repositories.json (the GitHub list in the Projects section).
  # GitHub disables scheduled workflows after 60 days without repository activity.
  schedule:
    - cron: '0 9 * * *'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      # prebuild runs fetch-repos; the token only raises the GitHub API rate limit
      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    # Pull requests only verify the build; publishing happens from main
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    # Only deployments are serialized; PR builds must not queue behind (or replace) a pending deploy
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
